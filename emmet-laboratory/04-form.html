<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="" id="">
    <input type="email" name="" id="">
    <input type="password" name="" id="">
    <input type="checkbox" name="" id="">
    <input type="radio" name="" id="">
    <input type="submit" value="">

    <form action="#" method="POST">
        <div class="form-group"><label for="student-id">Student ID:</label><input type="text" id="student-id" name="student_id" required="required"></div>
        <div class="form-group"><label for="fullname">Full Name:</label><input type="text" id="fullname" name="fullname" required="required"></div>
        <div class="form-group"><label for="email">Email:</label><input type="email" id="email" name="email" required="required"></div>
        <div class="form-group"><label for="password">Password:</label><input type="password" id="password" name="password" required="required"></div>
        <div class="form-group"><label for="">Gender:</label><label><input type="radio" name="gender" value="male">Male</input></label><label><input type="radio" name="gender" value="female">Female</input></label></div>
        <div class="form-group"><label for="course">Course:</label>
            <select name="course" id="course">
                <option value="">--Select Course--</option>
                <option value="cs">Computer Science</option>
                <option value="it">Information Technology</option>
                <option value="is">Information Systems</option>
            </select>
        </div>
        <div class="form-group"><label for="">Hobbies:</label><label><input type="checkbox" name="hobbies" value="reading">Reading</input></label><label><input type="checkbox" name="hobbies" value="coding">Coding</input></label><label><input type="checkbox" name="hobbies" value="sports">Sports</input></label></div>
        <div class="form-group"><label for="address">Address:</label><textarea name="address" id="address" rows="4"></textarea></div>
        <button type="submit">Submit</button>
    </form>


</body>
</html>
